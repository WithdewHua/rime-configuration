# 上游数据清单
# 由 update_upstream_dicts.py 同步，条目支持两种方式：
#   downloads: 从仓库分支或 Release 下载（.gz 自动解压，可用 {file, local} 重命名）
#   generate: 浅克隆仓库后执行生成脚本，把标准输出写入 local_path

# 雾凇拼音 OpenCC 数据
- owner: iDvel
  repo: rime-ice
  branch: main
  downloads:
    - path: opencc/
      local_path: Rime/Common/opencc/
      files: ["emoji.json", "emoji.txt", "others.txt"]

# 白霜拼音中文词库
- owner: gaboolic
  repo: rime-frost
  branch: master
  downloads:
    - path: cn_dicts/
      local_path: Rime/Common/dictionary/cn_dicts/rime-ice/
      files:
        - 8105.dict.yaml
        - 41448.dict.yaml
        - base.dict.yaml
        - ext.dict.yaml
        - tencent.dict.yaml
        - others.dict.yaml

# 魔然辅筛（仓库已迁至 rimeinn，旧地址 ksqsf 会 301 重定向）
- owner: rimeinn
  repo: rime-moran
  branch: main
  downloads:
    - path: lua/
      local_path: Rime/Common/lua
      files:
        - moran_aux_translator.lua
        - moran_fix_filter.lua
        - moran.lua
        - moran_pin.lua
        - moran_hint_filter.lua
    - path: opencc/
      local_path: Rime/Common/opencc/
      files:
        - moran_chaifen.json
        - moran_pinyinhint.txt
        - moran_pinyinhint.json
  # 上游不再提交这两份生成产物（.gitignore 中的 Generated artifacts），克隆后本地生成
  generate:
    - local_path: Rime/Common/lua/zrmdb.txt
      command: ["uv", "run", "tools/gen_zrmdb.py"]
    - local_path: Rime/Common/opencc/moran_chaifen.txt
      command: ["uv", "run", "tools/gen_chaifen_filter.py"]

# Qwen3-14B-Base 词频校准词库与语法模型
# 说明见 https://mizore.blog/posts/rime-llm-word-frequency/
# 仅替换本地已有同名来源的词库（zhwiki、moegirl、en）；语法模型替代万象 gram
# 其余成品词库（cs_ai、zhwiktionary、web_slang、wanxiang_mixed、en_ext）本地不使用
- owner: mizorewww
  repo: rime-qwen-freq
  branch: release
  # 不加 tag 时跟随最新 Release；需要固定版本时加上 tag: v0.4.0
  downloads:
    - path: .
      local_path: Rime/Common/dictionary/cn_dicts/
      files:
        - zhwiki.dict.yaml.gz
        - moegirl.dict.yaml.gz
    - path: .
      local_path: Rime/Common/dictionary/en_dicts/rime-ice/
      files:
        - file: rime_ice.en.dict.yaml.gz
          local: en.dict.yaml
    - path: .
      local_path: Rime/Common/
      files:
        - qwen14b-zh-hans.gram.gz
